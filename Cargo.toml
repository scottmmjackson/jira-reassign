[package]
name = "jira-reassign"
authors = ["Scott Jackson <me@scottmmjackson.com>"]
version = "0.1.1"
description = "Reassign Jira tickets by role field (reviewer, responsible engineer, etc.)"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
reqwest = { version = "0.12", features = ["blocking", "json", "native-tls-vendored"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6.0"
base64 = "0.22"
regex = "1"
